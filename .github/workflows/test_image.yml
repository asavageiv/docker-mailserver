name: 'Build a Test Image from Any Ref (fork only)'

# Builds any branch, tag or commit and publishes it to this repository's GHCR package as
#   ghcr.io/<owner>/docker-mailserver:<ref>          (moves with each build of that ref)
#   ghcr.io/<owner>/docker-mailserver:<ref>-<sha>    (immutable, 7 chars of the built commit)
# `<ref>` is the input, lowercased, with characters that are invalid in an image tag replaced by `-`
# (eg the branch `feat/foo` becomes `feat-foo`).
# Manual only. Not intended for the upstream project.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to build (eg forky)'
        required: true
        type: string
      platforms:
        description: 'Platforms (linux/amd64 or linux/amd64,linux/arm64)'
        required: false
        type: string
        default: linux/amd64
      no-cache:
        description: 'Ignore cached layers (forces apt-get upgrade to run again)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: 'Build and push'
    runs-on: ubuntu-24.04
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      # The input is passed via `env` instead of being interpolated into the script, to avoid injection.
      - name: 'Resolve image name and tags'
        id: prep
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/docker-mailserver"
          SHA=$(git rev-parse HEAD)
          SLUG=$(tr '[:upper:]' '[:lower:]' <<< "${INPUT_REF}" | sed -E 's/[^a-z0-9._-]+/-/g; s/^[.-]+//' | cut -c1-100)
          if [[ -z ${SLUG} ]]; then
            echo "Cannot derive an image tag from ref '${INPUT_REF}'" >&2
            exit 1
          fi
          {
            echo "image=${IMAGE}"
            echo "sha=${SHA}"
            echo "slug=${SLUG}"
            echo "tags=${IMAGE}:${SLUG},${IMAGE}:${SLUG}-${SHA:0:7}"
          } >>"${GITHUB_OUTPUT}"
        env:
          INPUT_REF: ${{ inputs.ref }}

      - name: 'Set up QEMU'
        if: contains(inputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v4.4.1

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Build and push'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          no-cache: ${{ inputs.no-cache }}
          build-args: |
            DMS_RELEASE=edge
            VCS_REVISION=${{ steps.prep.outputs.sha }}
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          cache-from: type=gha,scope=test-${{ steps.prep.outputs.slug }}
          cache-to: type=gha,mode=max,scope=test-${{ steps.prep.outputs.slug }}
          provenance: false

      - name: 'Summary'
        shell: bash
        run: |
          {
            echo "Pushed \`${IMAGE}\`:"
            echo '```'
            tr ',' '\n' <<< "${TAGS}"
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
        env:
          IMAGE: ${{ steps.prep.outputs.image }}
          TAGS: ${{ steps.prep.outputs.tags }}
